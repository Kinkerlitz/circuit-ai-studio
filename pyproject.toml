[project]
name = "circuit-ai-studio"
version = "0.1.0"
description = "Circuit Tracks AI Studio daemon, core DSL, and tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "mcp>=2.3.0",
    "mido>=1.3.3",
    "pydantic>=2.14.1",
    "python-rtmidi>=1.5.8",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
    "vendor/circuit-tracks-tools/src",
]
testpaths = ["tests"]
asyncio_mode = "auto"
